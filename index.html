<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parametric Maker</title>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js"}}
</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Param Maker">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

</head>
<body>
<header>
  <h1>Parametric Maker</h1>
  <select id="plateSel" style="display:none"></select>
  <button id="btnRender" class="pri">Update</button>
  <button id="btnDl" disabled>3MF</button>
</header>
<main>
  <section id="params" class="pane"><div id="plist"></div></section>
  <section id="codepane" class="pane">
    <div class="bar">
      <button id="btnUp">Upload file</button>
      <button id="btnPaste">Paste</button>
      <button id="btnSave">Save .scad</button>
      <input id="file" type="file" style="display:none">
    </div>
    <textarea id="code" placeholder="Paste OpenSCAD code here, or upload a .scad file" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>
  <section id="view" class="pane"><canvas id="cv"></canvas><div id="status">Loading…</div></section>
</main>
<nav>
  <button data-t="codepane" class="on">Code</button>
  <button data-t="params">Parameters</button>
  <button data-t="view">Preview</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
