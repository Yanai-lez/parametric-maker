<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מחולל פרמטרי תלת־ממד</title>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js"}}
</script>
<link rel="stylesheet" href="style.css">

</head>
<body>
<header>
  <h1>מחולל פרמטרי תלת־ממד</h1>
  <button id="btnRender" class="pri">רנדר</button>
  <button id="btnDl" disabled>STL</button>
</header>
<main>
  <section id="params" class="pane on"><div id="plist"></div></section>
  <section id="codepane" class="pane">
    <div class="bar">
      <button id="btnUp">העלה קובץ</button>
      <button id="btnPaste">הדבק מהלוח</button>
      <input id="file" type="file" accept=".scad,.txt" hidden>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>
  <section id="view" class="pane"><canvas id="cv"></canvas><div id="status">מוכן. לחץ "רנדר"</div></section>
</main>
<nav>
  <button data-t="params" class="on">פרמטרים</button>
  <button data-t="codepane">קוד</button>
  <button data-t="view">תצוגה</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
