<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מחולל פרמטרי תלת־ממד</title>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js"}}
</script>
<link rel="stylesheet" href="style.css?v=4">

</head>
<body>
<header>
  <h1>מחולל פרמטרי תלת־ממד <small style="color:var(--mut);font-weight:400">v4</small></h1>
  <button id="btnRender" class="pri">עדכן</button>
  <button id="btnDl" disabled>3MF</button>
</header>
<main>
  <section id="params" class="pane"><div id="plist"></div></section>
  <section id="codepane" class="pane">
    <div class="bar">
      <button id="btnUp">העלה קובץ</button>
      <button id="btnPaste">הדבק מהלוח</button>
      <input id="file" type="file" style="display:none">
    </div>
    <textarea id="code" placeholder="הדבק כאן קוד OpenSCAD, או העלה קובץ .scad" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </section>
  <section id="view" class="pane"><canvas id="cv"></canvas><div id="status">טוען…</div></section>
</main>
<nav>
  <button data-t="codepane" class="on">קוד</button>
  <button data-t="params">פרמטרים</button>
  <button data-t="view">תצוגה</button>
</nav>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
